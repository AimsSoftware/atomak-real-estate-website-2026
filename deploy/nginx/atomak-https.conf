# ATOMAK ONLY: use after a certificate for both domains is issued.
# Destination: /etc/nginx/conf.d/atomakrealestate.ae.conf
server {
    listen 80;
    listen [::]:80;
    server_name atomakrealestate.ae www.atomakrealestate.ae;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/atomakrealestate/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name atomakrealestate.ae www.atomakrealestate.ae;

    ssl_certificate /etc/letsencrypt/live/atomakrealestate.ae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atomakrealestate.ae/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
